backend:
  name: github
  repo: oleksii-savchenko/palmbeachstr
  branch: main
  base_url: https://cms-auth.hawkstyle-order.workers.dev
  auth_endpoint: /callback

media_folder: "images"
public_folder: "/images"

locale: en

collections:

  - name: "services"
    label: "Services"
    label_singular: "Service"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Number", name: "number", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image" }

  - name: "portfolio"
    label: "Portfolio"
    label_singular: "Photo"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Label", name: "label", widget: "string", required: false }

  - name: "reviews"
    label: "Reviews"
    label_singular: "Review"
    folder: "content/reviews"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Initials", name: "initials", widget: "string" }
      - { label: "Date & Service", name: "meta", widget: "string" }
      - { label: "Review Text", name: "text", widget: "text" }

  - name: "pricing"
    label: "Prices"
    label_singular: "Service Price"
    folder: "content/pricing"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Service Name", name: "name", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image" }

  - name: "settings"
    label: "Settings & Contacts"
    files:
      - label: "Contact Information"
        name: "contacts"
        file: "content/settings/contacts.json"
        format: "json"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
          - { label: "Thumbtack URL", name: "thumbtack", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
