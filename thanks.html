<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Palm Beach STR Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:  #FED461;
    --dark:  #171717;
    --dark2: #151515;
    --white: #FFFFFF;
  }

  html { scroll-padding-top: 90px; }
  @media (min-width: 769px) {
    html { scroll-behavior: smooth; }
  }
  @media (max-width: 768px) {
    html { scroll-behavior: auto; }
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--dark2);
    overflow-x: hidden;
  }

  /* ════════════════════════════════════════
     NAV
  ════════════════════════════════════════ */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(24px, 5.2vw, 100px);
    height: clamp(64px, 5vw, 90px);
    background: transparent;
    transition: background .4s, backdrop-filter .4s;
  }
  nav.scrolled {
    background: rgba(250,248,245,.92);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(0,0,0,.06);
    box-shadow: 0 2px 24px rgba(0,0,0,.08);
  }
  nav.scrolled .nav-links a { color: #151515; }
  nav.scrolled .nav-links a:hover { color: var(--gold); }
  nav.scrolled .nav-links a.active { color: var(--gold); }
  nav.scrolled .nav-cta { color: #151515; border-color: #151515; background: transparent; }
  nav.scrolled .nav-cta:hover { background: var(--gold); color: #151515; }
  nav.scrolled .nav-toggle span { background: #151515; }
  /* swap logo to dark version when scrolled */
  nav.scrolled .nav-logo-img { content: url("images/logo_white.svg"); }

  .nav-logo img {
    height: clamp(32px, 2.8vw, 53px);
    width: auto;
    display: block;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: clamp(24px, 2.5vw, 48px);
    list-style: none;
  }
  .nav-links a {
    font-size: clamp(13px, 0.85vw, 16px);
    font-weight: 400;
    color: var(--white);
    text-decoration: none;
    transition: color .2s;
  }
  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(16px, 1.5vw, 28px);
    height: clamp(40px, 2.8vw, 51px);
    border: 1px solid var(--gold);
    border-radius: 5px;
    font-size: clamp(12px, 0.75vw, 14px);
    font-weight: 500;
    color: var(--gold);
    text-decoration: none;
    white-space: nowrap;
    transition: all .25s;
    flex-shrink: 0;
  }
  .nav-cta:hover { background: var(--gold); color: var(--dark2); }

  /* Mobile toggle */
  .nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }
  .nav-toggle span {
    display: block;
    width: 24px; height: 1.5px;
    background: var(--white);
    transition: all .3s;
  }
  .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2) { opacity: 0; }
  .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  /* Mobile menu */
  .mobile-menu {
    display: none;
    position: fixed;
    top: clamp(64px, 5vw, 90px);
    left: 0; right: 0;
    background: rgba(23,23,23,.97);
    backdrop-filter: blur(16px);
    z-index: 99;
    padding: 32px 40px 48px;
    transform: translateY(-100%);
    opacity: 0;
    transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s;
    pointer-events: none;
  }
  .mobile-menu.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: all;
  }
  .mobile-menu a {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    color: var(--white);
    text-decoration: none;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
    transition: color .2s;
  }
  .mobile-menu a:hover { color: var(--gold); }
  .mobile-menu-cta {
    display: inline-block !important;
    margin-top: 28px;
    padding: 14px 32px !important;
    border: 1px solid var(--gold) !important;
    border-radius: 5px;
    color: var(--gold) !important;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    border-bottom: 1px solid var(--gold) !important;
  }

  /* ════════════════════════════════════════
     HERO
  ════════════════════════════════════════ */
  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .hero-bg-dark {
    position: absolute;
    inset: 0;
    background: var(--dark);
    z-index: 0;
  }
  .hero-bg img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .8;
    z-index: 1;
  }
  /* Видео поверх тёмного фона и картинки */
  .hero-video {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    z-index: 2 !important;
    opacity: 1 !important;
  }
  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      rgba(23,23,23,.72) 0%,
      rgba(23,23,23,.45) 55%,
      rgba(23,23,23,.25) 100%
    );
    z-index: 3;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(100px, 10vw, 160px) clamp(24px, 5.2vw, 100px) clamp(60px, 6vw, 100px);
  }

  .hero-location {
    font-size: clamp(13px, 0.85vw, 16px);
    color: var(--white);
    margin-bottom: clamp(16px, 1.5vw, 24px);
    letter-spacing: .02em;
  }

  .hero-title {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(40px, 5.2vw, 100px);
    font-weight: 400;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: clamp(24px, 2.5vw, 40px);
    /* Allow title to stretch wide enough for 2 lines */
    max-width: 75vw;
  }
  .hero-title .highlight { color: var(--gold); }
  .hero-line {
    display: block;
    white-space: nowrap;
  }

  .hero-subtitle {
    font-size: clamp(15px, 1.05vw, 20px);
    line-height: 1.4;
    color: var(--white);
    max-width: 560px;
    margin-bottom: clamp(36px, 3.5vw, 56px);
    opacity: .9;
  }

  .hero-actions {
    display: flex;
    gap: clamp(12px, 1vw, 16px);
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(24px, 2vw, 40px);
    height: clamp(48px, 3.5vw, 62px);
    border-radius: 4px;
    background: var(--gold);
    font-size: clamp(14px, 0.9vw, 17px);
    font-weight: 500;
    color: var(--dark2);
    text-decoration: none;
    transition: all .25s;
    white-space: nowrap;
  }
  .btn-primary:hover { background: #e8c050; transform: translateY(-1px); }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 clamp(24px, 2vw, 40px);
    height: clamp(48px, 3.5vw, 62px);
    border-radius: 4px;
    border: 1px solid var(--gold);
    font-size: clamp(14px, 0.9vw, 17px);
    font-weight: 500;
    color: var(--gold);
    text-decoration: none;
    transition: all .25s;
    white-space: nowrap;
  }
  .btn-outline:hover { background: rgba(254,212,97,.1); }
  .btn-outline svg { width: 15px; height: 15px; fill: var(--gold); flex-shrink: 0; }
  .btn-outline-icon { width: clamp(14px, 1vw, 18px); height: clamp(14px, 1vw, 18px); object-fit: contain; flex-shrink: 0; }

  /* Stats */
  .hero-stats {
    position: absolute;
    right: clamp(24px, 5.2vw, 100px);
    bottom: clamp(60px, 6vw, 100px);
    top: auto;
    transform: none;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 52px);
    align-items: flex-end;
  }

  .stat-item { text-align: right; }

  .stat-num {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(32px, 3.2vw, 60px);
    font-weight: 400;
    line-height: 1.08;
    color: var(--white);
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .stat-star { padding-top: 4px; }
  .stat-star svg { width: clamp(14px, 1.1vw, 20px); height: clamp(14px, 1.1vw, 20px); fill: var(--white); }

  .stat-label {
    font-size: clamp(11px, 0.8vw, 15px);
    color: var(--white);
    margin-top: 6px;
    max-width: 120px;
    line-height: 1.3;
    opacity: .85;
  }

  /* ════════════════════════════════════════
     SERVICES
  ════════════════════════════════════════ */
  .services-section {
    width: 100%;
    background: var(--white);
    padding: clamp(60px, 8vw, 140px) 0 0;
  }

  .services-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 0 clamp(24px, 5.2vw, 100px);
    margin-bottom: clamp(32px, 4vw, 64px);
  }

  .services-title {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(36px, 4.7vw, 90px);
    font-weight: 400;
    line-height: 1.08;
    color: var(--dark2);
  }

  .services-icon {
    flex-shrink: 0;
    width: clamp(36px, 3.75vw, 72px);
    height: auto;
    margin-top: 8px;
  }

  /* ── Service row: left col + right image col ── */
  .service-row {
    display: grid;
    /* Левая: от левого отступа до середины.
       Правая: фото заканчивается на уровне иконки-лого в header */
    grid-template-columns: 1fr 44%;
    align-items: stretch;
    /* Правый padding = отступ header, чтобы фото не выходило за иконку */
    padding-right: clamp(24px, 5.2vw, 100px);
  }

  /* Линия-разделитель: от левого отступа до правого отступа (уровень лого) */
  .service-divider {
    height: 1px;
    background: #151515;
    margin: 0 clamp(24px, 5.2vw, 100px);
  }

  .service-left {
    display: flex;
    flex-direction: column;
    /* Центрируем текст по вертикали относительно высоты фото */
    justify-content: center;
    padding: clamp(32px, 3.5vw, 64px) clamp(24px, 3vw, 56px) clamp(32px, 3.5vw, 64px) clamp(24px, 5.2vw, 100px);
  }

  /* Номер + название в одной строке */
  .service-num-name {
    display: flex;
    align-items: baseline;
    gap: clamp(12px, 1vw, 20px);
    margin-bottom: clamp(16px, 1.5vw, 24px);
  }

  .service-num {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(12px, 0.9vw, 17px);
    color: var(--gold);
    line-height: 1;
    flex-shrink: 0;
    /* Выравниваем с baseline заголовка */
    align-self: baseline;
  }

  .service-name {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(28px, 3.1vw, 60px);
    font-weight: 400;
    line-height: 1.08;
    color: var(--dark2);
  }

  /* Описание — отступ слева = ширина числа + gap,
     чтобы текст начинался точно под заголовком */
  .service-desc {
    font-size: clamp(13px, 0.85vw, 17px);
    line-height: 1.55;
    color: var(--dark2);
    opacity: .8;
    /* Отступ слева = примерно ширина num + gap */
    padding-left: clamp(28px, 2.2vw, 40px);
    max-width: 52ch;
  }

  /* Фото — правая колонка */
  .service-img-wrap {
    overflow: hidden;
    position: relative;
  }

  .service-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    min-height: clamp(240px, 22vw, 420px);
    transition: transform .6s cubic-bezier(.25,.46,.45,.94);
  }
  .service-row:hover .service-img { transform: scale(1.04); }

  /* ════════════════════════════════════════
     RESPONSIVE
  ════════════════════════════════════════ */
  @media (max-width: 768px) {
    /* Nav */
    .nav-links, .nav-cta { display: none; }
    .nav-toggle { display: flex; }
    .mobile-menu { display: block; }

    /* Hero stats — move inline */
    .hero-stats {
      position: static;
      transform: none;
      flex-direction: row;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,.15);
      align-items: flex-start;
    }
    .stat-item { text-align: left; }
    .stat-num { justify-content: flex-start; }
    .stat-label { max-width: none; }

    /* Services */
    .service-row {
      grid-template-columns: 1fr;
      padding-right: 0;
    }
    .service-left {
      padding: 28px 24px 20px;
    }
    .service-desc { padding-left: clamp(24px, 2vw, 36px); }
    .service-divider { margin: 0 20px; }
    .service-img-wrap { width: 100%; }
    .service-img { min-height: 240px; max-height: 320px; }
  }

  @media (max-width: 480px) {
    /* hero-actions stays row on all mobile sizes */
    .services-header { padding: 0 20px; }
    .service-row { padding: 0 20px; }
    .service-img-wrap { margin-left: -20px; width: calc(100% + 40px); }
  }

  /* ════════════════════════════════════════
     PORTFOLIO
  ════════════════════════════════════════ */
  .portfolio-section {
    width: 100%;
    background: #F8F5F1;
    padding: clamp(60px, 8vw, 140px) 0 clamp(60px, 6vw, 100px);
  }

  .portfolio-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 0 clamp(24px, 5.2vw, 100px);
    margin-bottom: clamp(32px, 3.5vw, 64px);
  }

  .portfolio-title {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(48px, 4.7vw, 90px);
    font-weight: 400;
    line-height: 1.08;
    color: #151515;
  }

  .portfolio-sub {
    font-size: clamp(13px, 0.85vw, 16px);
    font-weight: 400;
    line-height: 1.4;
    color: #151515;
    text-align: right;
    max-width: 280px;
    opacity: .8;
    align-self: center;
  }

  /* Grid: 4 cols × 2 rows */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, auto);
    gap: clamp(6px, 0.5vw, 9px);
    padding: 0 clamp(24px, 5.2vw, 100px);
    margin-bottom: clamp(40px, 4vw, 72px);
  }

  .portfolio-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 422 / 536;
    background: #ccc;
  }

  .portfolio-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .5s cubic-bezier(.25,.46,.45,.94);
  }
  .portfolio-item:hover img { transform: scale(1.04); }

  /* Before/after label */
  .pf-label {
    position: absolute;
    bottom: clamp(12px, 1.2vw, 20px);
    left: clamp(12px, 1.2vw, 20px);
    font-family: 'Instrument Serif', serif;
    font-size: clamp(14px, 1vw, 18px);
    font-style: italic;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }

  /* Hover overlay */
  .pf-overlay {
    position: absolute;
    inset: 0;
    background: rgba(21,21,21,.25);
    opacity: 0;
    transition: opacity .3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .portfolio-item:hover .pf-overlay { opacity: 1; }
  .pf-zoom {
    width: clamp(36px, 2.5vw, 48px);
    height: clamp(36px, 2.5vw, 48px);
    border: 1.5px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pf-zoom svg { width: 18px; height: 18px; stroke: #fff; fill: none; }

  /* Instagram button */
  .portfolio-footer {
    display: flex;
    justify-content: center;
  }

  .btn-instagram {
    display: inline-flex;
    align-items: center;
    gap: clamp(8px, 0.6vw, 12px);
    padding: 0 clamp(24px, 2vw, 40px);
    height: clamp(48px, 3.5vw, 62px);
    border-radius: 4px;
    background: var(--gold);
    font-size: clamp(14px, 0.9vw, 17px);
    font-weight: 500;
    color: #151515;
    text-decoration: none;
    transition: background .25s;
    white-space: nowrap;
  }
  .btn-instagram:hover { background: #e8c050; }
  .btn-instagram img {
    width: clamp(14px, 0.9vw, 16px);
    height: clamp(14px, 0.9vw, 16px);
    flex-shrink: 0;
  }

  /* ─── LIGHTBOX ─── */
  .lightbox {
    display: flex;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0,0,0,.92);
    align-items: center;
    justify-content: center;
    visibility: hidden;
  }
  .lightbox.active { visibility: visible; }

  .lightbox-inner {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    align-items: center;
    gap: clamp(12px, 2vw, 32px);
  }

  .lightbox-img {
    max-width: 80vw;
    max-height: 88vh;
    object-fit: contain;
    display: block;
    border-radius: 2px;
  }

  .lightbox-close {
    position: fixed;
    top: clamp(16px, 2vw, 32px);
    right: clamp(16px, 2vw, 32px);
    width: 44px; height: 44px;
    background: none;
    border: 1.5px solid rgba(255,255,255,.4);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    transition: border-color .2s;
    z-index: 1000;
  }
  .lightbox-close:hover { border-color: #fff; }

  .lightbox-arrow {
    background: none;
    border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 50%;
    width: clamp(40px, 3vw, 56px);
    height: clamp(40px, 3vw, 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color .2s;
  }
  .lightbox-arrow:hover { border-color: #fff; }
  .lightbox-arrow svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 1.5; }

  .lightbox-counter {
    position: fixed;
    bottom: clamp(16px, 2vw, 28px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: rgba(255,255,255,.5);
    letter-spacing: .06em;
  }

  /* ─── PORTFOLIO RESPONSIVE ─── */
  @media (max-width: 900px) {
    .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
    .portfolio-header { flex-direction: column; gap: 12px; }
    .portfolio-sub { text-align: left; }
  }
  @media (max-width: 480px) {
    .portfolio-header { padding: 0 20px; }
    .portfolio-grid { padding: 0 20px; gap: 4px; }
    .lightbox-inner { gap: 8px; }
    .lightbox-img { max-width: 92vw; }
  }


  /* ════════════════════════════════════════
     ABOUT / ONE TEAM
  ════════════════════════════════════════ */
  .about-section {
    position: relative;
    width: 100%;
    min-height: clamp(480px, 40vw, 680px);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* Background image */
  .about-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .about-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Dark overlay */
  .about-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(21,21,21,.62);
  }

  /* Content grid */
  .about-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(32px, 4vw, 80px);
    align-items: center;

    color: #fff;
    line-height: 1.4;
    margin-bottom: clamp(24px, 2.5vw, 40px);
    opacity: .85;
  }

  /* email + socials row */
  .contact-email-row {
    display: flex;
    align-items: center;
    gap: clamp(16px, 1.8vw, 28px);
    margin-bottom: clamp(16px, 1.8vw, 28px);
    flex-wrap: wrap;
  }
  .contact-email {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(22px, 2.8vw, 50px);
    color: #fff;
    text-decoration: none;
    transition: opacity .2s;
    line-height: 1;
  }
  .contact-email:hover { opacity: .75; }

  .contact-socials {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .contact-social-link {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .2s;
  }
  .contact-social-link:hover { opacity: .7; }
  .contact-social-link img {
    width: clamp(28px, 2.2vw, 40px);
    height: clamp(28px, 2.2vw, 40px);
    object-fit: contain;
  }

  /* Right — form with liquid glass effect */
  .contact-form-wrap {
    width: clamp(320px, 28vw, 480px);
    flex-shrink: 0;

    /* Liquid glass effect */
    background: rgba(217, 217, 217, 0.18);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px;
    padding: clamp(28px, 3vw, 48px) clamp(24px, 2.5vw, 40px);
    box-shadow:
      0 8px 32px rgba(0,0,0,.18),
      inset 0 1px 0 rgba(255,255,255,.25),
      inset 0 -1px 0 rgba(255,255,255,.08);
  }

  /* Field groups */
  .form-field {
    margin-bottom: clamp(14px, 1.4vw, 20px);
  }

  .form-field label {
    display: block;
    font-size: clamp(11px, 0.65vw, 12px);
    font-weight: 400;
    color: #fff;
    margin-bottom: 6px;
    opacity: .9;
  }

  .form-field input,
  .form-field textarea {
    width: 100%;
    border-radius: 4px;
    border: none;
    background: #fff;
    padding: clamp(14px, 1.2vw, 20px) clamp(16px, 1.4vw, 27px);
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(14px, 0.85vw, 16px);
    font-weight: 400;
    color: #000;
    outline: none;
    transition: box-shadow .2s;
    appearance: none;
  }
  .form-field input::placeholder,
  .form-field textarea::placeholder { color: rgba(0,0,0,.35); }
  .form-field input:focus,
  .form-field textarea:focus {
    box-shadow: 0 0 0 2px rgba(254,212,97,.6);
  }

  .form-field textarea {
    resize: vertical;
    min-height: clamp(80px, 7vw, 120px);
  }

  .btn-send {
    width: 100%;
    height: clamp(48px, 3.5vw, 60px);
    border-radius: 4px;
    background: var(--gold);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(14px, 0.9vw, 16px);
    font-weight: 500;
    color: #1D1D1D;
    cursor: pointer;
    transition: background .25s, transform .2s;
    margin-top: 0;
  }
  .btn-send:hover { background: #e8c050; transform: translateY(-1px); }
  .btn-send:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  /* Success / error messages */
  .form-message {
    display: none;
    margin-top: 12px;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 400;
    text-align: center;
  }
  .form-message.success {
    display: block;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,.3);
  }
  .form-message.error {
    display: block;
    background: rgba(220,50,50,.15);
    color: #ffcccc;
    border: 1px solid rgba(220,50,50,.3);
  }

  /* ─── CONTACT RESPONSIVE ─── */
  @media (max-width: 1024px) {
    .contact-inner {
      grid-template-columns: 1fr;
      gap: 40px;

      width: 100%;
      max-width: 560px;

  /* ════════════════════════════════════════
     PARALLAX
  ════════════════════════════════════════ */
  .parallax-bg {
    will-change: transform;
    transition: transform 0s linear;
  }


  /* ── POPUP FADE ANIMATIONS ── */
  .lightbox,
  .video-popup,
  .estimate-popup {
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  .lightbox.active,
  .video-popup.active,
  .estimate-popup.active {
    opacity: 1;
    pointer-events: all;
  }
  /* Inner scale-up on open */
  .lightbox-inner,
  .video-popup-inner,
  .estimate-popup-inner {
    transform: scale(.96);
    transition: transform .35s cubic-bezier(.34,1.3,.64,1);
  }
  .lightbox.active .lightbox-inner,
  .video-popup.active .video-popup-inner,
  .estimate-popup.active .estimate-popup-inner {
    transform: scale(1);
  }


  /* ════════════════════════════════════════
     PRELOADER
  ════════════════════════════════════════ */
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity .6s ease, visibility .6s ease;
  }
  #preloader.hiding {
    animation: circleUp 0.85s cubic-bezier(.4,0,.2,1) forwards;
    pointer-events: none;
  }
  #preloader.hidden {
    display: none;
  }

  @keyframes circleUp {
    0%   {
      clip-path: circle(150% at 50% 120%);
      opacity: 1;
    }
    100% {
      clip-path: circle(0% at 50% -10%);
      opacity: 1;
    }
  }

  /* SVG logo — reveal animation using clip from bottom */
  .preloader-logo {
    width: clamp(100px, 13vw, 180px);
    height: auto;
    overflow: visible;
  }

  /* Each path fades + rises in */
  .logo-path {
    fill: #FED461;
    opacity: 0;
    transform: translateY(8px);
    animation: revealPath 0.7s cubic-bezier(.22,1,.36,1) forwards;
  }
  .logo-path:nth-child(1) { animation-delay: 0s; }
  .logo-path:nth-child(2) { animation-delay: 0.35s; }
  .logo-path:nth-child(3) { animation-delay: 0.65s; }

  @keyframes revealPath {
    to { opacity: 1; transform: translateY(0); }
  }

  .preloader-logo-wrap {
    position: relative;
    display: inline-block;
  }

  /* Logo name text under icon */
  .preloader-name {
    margin-top: clamp(20px, 2.5vw, 36px);
    text-align: center;
    opacity: 0;
    animation: fadeInName .6s ease .8s forwards;
  }
  @keyframes fadeInName {
    to { opacity: 1; }
  }

  .preloader-name-top {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(8px, .7vw, 13px);
    font-weight: 600;
    letter-spacing: .55em;
    text-transform: uppercase;
    color: #fff;
    display: block;
  }
  .preloader-name-bottom {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(18px, 1.8vw, 30px);
    font-weight: 500;
    letter-spacing: -.01em;
    text-transform: uppercase;
    color: #fff;
    display: block;
    margin-top: 4px;
  }

  /* Counter */
  .preloader-counter {
    position: absolute;
    bottom: clamp(32px, 4vw, 64px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Instrument Serif', serif;
    font-size: clamp(28px, 3vw, 52px);
    font-weight: 400;
    color: rgba(255,255,255,.5);
    letter-spacing: .02em;
    width: 80px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* Prevent scroll while preloader is active */
  body.loading {
    overflow: hidden;
  }


  /* ════════════════════════════════════════
     HERO — MOBILE (≤768px)
     Точно 100dvh, всё внутри одного экрана
  ════════════════════════════════════════ */
  @media (max-width: 768px) {

    /* Hero = ровно один экран */
    .hero {
      min-height: 100dvh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Фон — видео на весь блок */
    .hero-bg {
      position: absolute;
      inset: 0;
    }
    .hero-bg-dark,
    .hero-video,
    .hero-bg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(21,21,21,.60);
      z-index: 1;
    }

    /* Контентная область — flex-column на всю высоту */
    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      /* Распределяем: геолейбл+заголовок+кнопки прижаты к низу,
         статы — у самого дна */
      justify-content: flex-end;
      height: 100%;
      padding: 0 18px 0;
    }

    /* Геолейбл */
    .hero-location {
      font-size: 12px;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: .01em;
    }

    /* Заголовок — 3 строки как в макете */
    .hero-title {
      font-size: 39px;
      line-height: 1.08;
      margin-bottom: 20px;
      max-width: 100%;
      white-space: normal;
    }
    .hero-line {
      display: block;
      white-space: normal;
    }

    /* Кнопки — строго в ряд, половина экрана каждая */
    .hero-actions {
      display: flex;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      gap: 8px;
      margin-bottom: 0;
      width: 100%;
    }

    .btn-primary {
      flex: 1 1 0;
      min-width: 0;
      height: 41px !important;
      font-size: 11px !important;
      font-weight: 500;
      padding: 0 8px !important;
      border-radius: 3px !important;
      white-space: nowrap;
      justify-content: center;
      width: auto !important;
    }

    .btn-outline {
      flex: 1 1 0;
      min-width: 0;
      height: 41px !important;
      font-size: 11px !important;
      font-weight: 500;
      padding: 0 8px !important;
      border-radius: 3px !important;
      white-space: nowrap;
      justify-content: center;
      width: auto !important;
    }

    .btn-outline-icon {
      width: 10px !important;
      height: 10px !important;
    }

    /* Статы — горизонтально в ряд у самого дна */
    .hero-stats {
      position: static !important;
      transform: none !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: flex-start !important;
      flex-wrap: nowrap !important;
      gap: 0 !important;
      padding-top: 16px;
      padding-bottom: 20px;
      border-top: 1px solid rgba(255,255,255,.15);
      margin-top: 16px;
      width: 100%;
    }

    .stat-item {
      text-align: left !important;
      flex: 1;
    }

    .stat-num {
      font-size: 35px !important;
      line-height: 1.08;
      color: #fff;
      display: flex !important;
      align-items: flex-start !important;
      justify-content: flex-start !important;
      gap: 2px;
    }
    .stat-star svg {
      width: 12px !important;
      height: 12px !important;
    }

    .stat-label {
      font-size: 9px !important;
      line-height: 1.4;
      margin-top: 4px;
      max-width: 62px;
      opacity: .8;
    }

    /* Subtitle — скрываем на мобайле (не влезает) */
    .hero-subtitle { display: none; }

    /* Десктопные статы не показываем отдельно —
       на мобайле они всегда внутри .hero-content через JS */
  }

  /* Fallback для браузеров без dvh */
  @supports not (height: 100dvh) {
    @media (max-width: 768px) {
      .hero { height: 100vh; min-height: 100vh; }
    }
  }

  @media (max-width: 768px) {

    /* ── БЛОК 2: Full-Service STR Design ── */

    .services-header {
